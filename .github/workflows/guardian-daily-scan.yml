name: GitHub Operations Guardian Daily Scan

on:
  schedule:
    - cron: '0 8 * * *'     # Daily at 08:00 UTC
  workflow_dispatch:          # Manual trigger

permissions:
  contents: write
  issues: read
  pull-requests: read
  discussions: read
  actions: read

jobs:
  guardian-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run Guardian Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m tools.github_guardian \
            --repo ${{ github.repository }} \
            --output .github/GUARDIAN_REPORT.md \
            --json .github/guardian_report.json

      - name: Check for Critical Alerts
        id: check
        run: |
          python -c "
          import json
          with open('.github/guardian_report.json') as f:
              report = json.load(f)
          status = report['status']
          print(f'Guardian status: {status}')
          if status == 'critical':
              print('::error::Repository health is CRITICAL — see GUARDIAN_REPORT.md')
              exit(1)
          "

      - name: Upload Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guardian-report
          path: |
            .github/GUARDIAN_REPORT.md
            .github/guardian_report.json

      - name: Auto-commit Report
        if: github.event_name == 'schedule'
        run: |
          git config user.name "github-guardian[bot]"
          git config user.email "guardian[bot]@users.noreply.github.com"
          git add .github/GUARDIAN_REPORT.md .github/guardian_report.json
          git diff --staged --quiet || git commit -m "docs: daily guardian health report $(date +%Y-%m-%d)"
          git push
