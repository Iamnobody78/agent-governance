name: Agent Governance CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.10'}
      - run: pip install -r requirements.txt ruff pyyaml
      
      - name: Ruff lint (zero tolerance)
        run: ruff check . --output-format=github
      
      - name: Stage 1 — Contract Hardening
        run: |
          python scripts/validate_interfaces.py --strict
          echo "Contract hardening PASSED"
      
      - name: Stage 2 — Entropy Budget Check
        run: |
          python scripts/thermal_health_check.py || echo "WARNING: entropy threshold exceeded (non-blocking)"
      
      - name: Stage 3 — Monotonic Constraint (P3)
        run: |
          python governance/meta/monotonic_constraint.py --ci-check

  deadlock-and-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.10'}
      - run: pip install -r requirements.txt pytest pytest-timeout
      
      - name: Deadlock Detection
        run: pytest tests/test_deadlock.py --timeout=60 -v
      
      - name: Contract Tests
        run: pytest tests/test_contract.py -v

  self-heal-on-failure:
    needs: [lint-and-contract, deadlock-and-integration]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.10'}
      - name: Self-Heal Attempt
        run: |
          python scripts/self_heal.py || echo "Self-heal attempted (non-blocking)"
      - name: Push Hotfix Branch
        if: success()
        run: |
          git config user.name "governance-agent[bot]"
          git config user.email "agent@bottlesumo.dev"
          git checkout -b hotfix/ci_fix_$(date +%Y%m%d_%H%M%S)
          git add liquid/ghosts/
          git commit -m "auto: self-heal patch from CI failure" || true
          git push origin HEAD 2>/dev/null || echo "Push skipped (no remote or no changes)"
