[project]
name = "agent-governance"
version = "1.7.0"
description = "AI Agent Governance Framework with meta-cognition, self-evolution, and safety boundaries — FixedPointDetector, GodelianBoundary, MetaCognitiveLoop, SelfCheckEngine, DigitalTwinCalibrator"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "BottleSumo Project"}
]
keywords = ["ai-agent", "governance", "meta-governance", "agent-framework"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
    "gymnasium>=0.29",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.3",
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
telemetry = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
]
all = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
